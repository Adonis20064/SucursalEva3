{% extends "sucursales/base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:2rem auto;">
  <h1>Iniciar sesión</h1>
  {% if error %}<div class="msg error" role="alert">{{ error }}</div>{% endif %}
  <form method="post" action="{% url 'sucursales:login' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="username">Usuario</label>
    <input type="text" id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>
    <p><button class="btn" type="submit">Entrar</button></p>
  </form>
</div>
{% endblock %}
