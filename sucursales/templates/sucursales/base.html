<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sucursales{% endblock %}</title>
  <style>
    :root { --bg:#f4f5f7; --card:#fff; --text:#1f2933; --muted:#667085; --line:#e4e7ec; --primary:#2563eb; --danger:#c62828; --ok:#1b7f3b; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#14171c; --card:#1d2128; --text:#e6e8eb; --muted:#9aa4b2; --line:#2d333c; --primary:#5b8def; --danger:#ef6a6a; --ok:#4cc27a; }
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
    header { display:flex; justify-content:space-between; align-items:center; padding:.8rem 1.5rem; background:var(--card); border-bottom:1px solid var(--line); }
    header form { display:inline; margin:0; }
    main { max-width:960px; margin:1.5rem auto; padding:0 1rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:1.25rem; }
    h1 { margin-top:0; font-size:1.4rem; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.6rem .5rem; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:.85rem; }
    td.num, th.num { text-align:right; }
    .btn { display:inline-block; padding:.45rem .9rem; border-radius:6px; border:1px solid var(--primary); background:var(--primary); color:#fff; text-decoration:none; cursor:pointer; font-size:.9rem; }
    .btn.sec { background:transparent; color:var(--primary); }
    .btn.danger { background:var(--danger); border-color:var(--danger); }
    .acciones { display:flex; gap:.4rem; align-items:center; }
    .acciones form { margin:0; }
    label { display:block; font-weight:600; margin:.9rem 0 .3rem; }
    input[type=text], input[type=password], input[type=number], select { width:100%; padding:.55rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); }
    .check { display:flex; align-items:center; gap:.5rem; margin-top:1rem; }
    .check label { margin:0; }
    .error { color:var(--danger); font-size:.85rem; margin-top:.25rem; }
    .msg { padding:.7rem 1rem; border-radius:6px; margin-bottom:.8rem; border:1px solid var(--line); background:var(--card); }
    .msg.success { border-color:var(--ok); color:var(--ok); }
    .msg.error { border-color:var(--danger); color:var(--danger); }
    .badge { font-size:.75rem; padding:.1rem .5rem; border-radius:99px; border:1px solid var(--line); }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; }
    .muted { color:var(--muted); }
    header a, .card a:not(.btn) { color:var(--primary); }
    .nivel { margin:1.2rem 0 .4rem; color:var(--muted); font-size:.85rem; text-transform:uppercase; letter-spacing:.05em; }
    .rep-list { list-style:none; padding:0; margin:0; }
    .rep-list li { padding:.45rem 0; border-bottom:1px solid var(--line); }
    .filtros { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.2rem 1rem; align-items:end; margin-bottom:1rem; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;gap:1.2rem;align-items:center;">
      <strong>Sucursales</strong>
      {% if user.is_authenticated %}
        <a href="{% url 'sucursales:lista' %}">Productos</a>
        <a href="{% url 'sucursales:reportes' %}">Reportes</a>
      {% endif %}
    </div>
    <div>
      {% if user.is_authenticated %}
        <span class="muted">{{ user.get_username }}</span>
        <form method="post" action="{% url 'sucursales:logout' %}">
          {% csrf_token %}
          <button class="btn sec" type="submit">Cerrar sesión</button>
        </form>
      {% endif %}
    </div>
  </header>
  <main>
    {% for m in messages %}
      <div class="msg {{ m.tags }}" role="status">{{ m }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
